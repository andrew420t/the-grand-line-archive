name: Verify application

on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/card-identification, feature/scanner-number-first-verification, fix/card-reference-images-stage3-2026-11-27, audit/official-bandai-inventory-stage4b-1l-2026-11-27]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check lint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Reconcile application printing identities against official Bandai inventory (audit branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27'
        run: node scripts/auditApplicationReferencePrintingParity.mjs
      - name: Upload Stage 4B-1O application printing reconciliation
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27'
        uses: actions/upload-artifact@v4
        with:
          name: stage4b-1o-application-printing-reconciliation
          path: artifacts/application-reference-printing-reconciliation-stage4b-1o.json
          if-no-files-found: warn
      - name: Reconcile Stage 4B-1P Premium Card Collection identities and Testing inventory persistence (audit branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27'
        run: node scripts/auditPremiumCardCollectionStage4b1p.mjs
      - name: Upload Stage 4B-1P Premium Card Collection and Testing persistence audit
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27'
        uses: actions/upload-artifact@v4
        with:
          name: stage4b-1p-premium-card-collection-persistence
          path: artifacts/premium-card-collection-persistence-reconciliation-stage4b-1p.json
          if-no-files-found: warn
      - name: Audit official Bandai image URLs (audit branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27' && contains(github.event.head_commit.message, '[run-image-audit]')
        run: node scripts/auditOfficialBandaiImages.mjs
      - name: Upload official image HTTP audit
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27' && contains(github.event.head_commit.message, '[run-image-audit]')
        uses: actions/upload-artifact@v4
        with:
          name: official-bandai-image-http-audit
          path: artifacts/official-bandai-image-http-audit.json
          if-no-files-found: warn
