name: Verify application

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - feature/card-identification
      - feature/scanner-number-first-verification
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check lint
        run: npm run lint
      - name: Build production site
        run: npm run build
