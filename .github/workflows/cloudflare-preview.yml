name: Cloudflare Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build preview
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Create isolated preview config
        run: |
          cat > wrangler-preview.jsonc <<'EOF'
          {
            "name": "grand-line-archive-preview-pr-${{ github.event.pull_request.number || 'manual' }}",
            "compatibility_date": "2026-11-20",
            "assets": {
              "directory": "./dist"
            }
          }
          EOF
      - name: Deploy isolated preview Worker
        run: npx wrangler@4 deploy --config wrangler-preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
