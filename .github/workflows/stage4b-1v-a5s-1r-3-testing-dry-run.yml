name: Stage 4B-1V-A5S-1R-3 Testing-only dry-run review

on:
  push:
    branches:
      - audit/official-bandai-inventory-stage4b-1l-2026-11-27
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  testing-only-catalogue-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out application repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify exact audit branch and starting commit ancestry
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27"
          git merge-base --is-ancestor 6849be5523f1e2139418b8cab2a2f008ef6b91b1 HEAD
          echo "Application HEAD: $(git rev-parse HEAD)"
          echo "Stage 1R-2 starting commit is an ancestor."

      - name: Check out exact pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: hotavocado/koala-kollect-data
          ref: 619965ec198047de519dc6eb098c7a56aed9bd58
          path: .source/koala-kollect-data
          fetch-depth: 1
          persist-credentials: false

      - name: Verify upstream commit, tree and manifest identity
        shell: bash
        run: |
          cd .source/koala-kollect-data
          test "$(git rev-parse HEAD)" = "619965ec198047de519dc6eb098c7a56aed9bd58"
          test "$(git rev-parse HEAD^{tree})" = "d0059fd77462cf377b9dfd65d87a6afabc76077f"
          test "$(git hash-object manifest.json)" = "5b76b3f0ceb268d1bf43bff7c5dd54ab438076e7"
          test "$(find data -name '*.jsonl' -type f | wc -l | tr -d ' ')" = "27"

      - name: Download the retained Stage 4B-1P assignment evidence
        uses: actions/download-artifact@v4
        with:
          name: stage4b-1p-premium-card-collection-persistence
          run-id: 46053970318
          github-token: ${{ github.token }}
          path: historical-1p

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Re-run Testing-only read-only snapshot comparison
        id: testing_snapshot_comparison
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        run: |
          node scripts/compareTestingCatalogueSnapshotStage4b1va5s1r9.mjs \
            --snapshot docs/catalogue-coverage/stage4b-1v-a5s-1r-9-testing-read-only-snapshot.json \
            --output artifacts-stage4b1r3/testing-read-only-comparison.json

      - name: Run complete pinned-source and historical-evidence dry-run
        id: importer_dry_run
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        shell: bash
        run: |
          manifest="$(find historical-1p -maxdepth 2 -type f -name '*.json' -print -quit)"
          test -n "$manifest"
          mkdir -p artifacts-stage4b1r3
          node scripts/catalogue-importer-stage4b1va.mjs \
            --dry-run \
            --source-dir .source/koala-kollect-data \
            --historical-1p "$manifest" \
            --source-commit 619965ec198047de519dc6eb098c7a56aed9bd58 \
            --source-tree d0059fd77462cf377b9dfd65d87a6afabc76077f \
            --output artifacts-stage4b1r3/importer-dry-run.json
          node -e "const r=require('./artifacts-stage4b1r3/importer-dry-run.json'); console.log(JSON.stringify({status:r.status,source:r.source,reconciliation:r.reconciliation,writesPerformed:r.writesPerformed,liveImportCapability:r.liveImportCapability},null,2))"

      - name: Run full-source importer integration assertions
        id: importer_integration
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        shell: bash
        run: |
          manifest="$(find historical-1p -maxdepth 2 -type f -name '*.json' -print -quit)"
          CATALOGUE_SOURCE_DIR=.source/koala-kollect-data CATALOGUE_HISTORICAL_1P="$manifest" \
            node --test tests/catalogueImporterStage4b1va.test.js

      - name: Run full application test suite
        id: full_test_suite
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: npm test

      - name: Run application lint
        id: lint
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Build production application
        id: production_build
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: npm run build

      - name: Upload dry-run evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4b-1v-a5s-1r-3-testing-dry-run
          path: artifacts-stage4b1r3/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run if any dry-run or validation failed
        id: final_acceptance
        if: always()
        shell: bash
        env:
          DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          SNAPSHOT_COMPARISON: ${{ steps.testing_snapshot_comparison.outcome }}
          IMPORTER_DRY_RUN: ${{ steps.importer_dry_run.outcome }}
          IMPORTER_INTEGRATION: ${{ steps.importer_integration.outcome }}
          TESTS: ${{ steps.full_test_suite.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.production_build.outcome }}
          ARTIFACT_UPLOAD: ${{ steps.upload_evidence.outcome }}
        run: |
          failed=0
          for check in \
            "dependencies=$DEPENDENCIES" \
            "testing-read-only-snapshot-comparison=$SNAPSHOT_COMPARISON" \
            "offline-importer-dry-run=$IMPORTER_DRY_RUN" \
            "importer-integration=$IMPORTER_INTEGRATION" \
            "full-tests=$TESTS" \
            "lint=$LINT" \
            "production-build=$BUILD" \
            "artifact-upload=$ARTIFACT_UPLOAD"; do
            name="${check%%=*}"
            outcome="${check#*=}"
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          test "$failed" -eq 0

# This workflow has no Supabase credentials or database connection. It cannot write to Testing or Production.
# Schema and inventory inspection is performed separately through read-only queries against the verified Testing project.
# OP18/EB05 local supplements and database-aware insert/update/no-op planning remain separate blockers.
