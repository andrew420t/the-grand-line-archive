name: Stage 4B-1V A5S-1R-2 evidence reconciliation

on:
  push:
    branches:
      - audit/official-bandai-inventory-stage4b-1l-2026-11-27
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile-historical-catalogue-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out application repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Confirm audit branch and required starting commit
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/audit/official-bandai-inventory-stage4b-1l-2026-11-27"
          git merge-base --is-ancestor 88309df793445acbccfc5e71f1f77c0aa7b30bf0 HEAD
          echo "Application HEAD: $(git rev-parse HEAD)"
          echo "Required Stage 1R-1 commit is an ancestor."

      - name: Check out exact pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: hotavocado/koala-kollect-data
          ref: 619965ec198047de519dc6eb098c7a56aed9bd58
          path: .source/koala-kollect-data
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned upstream identity
        shell: bash
        run: |
          cd .source/koala-kollect-data
          test "$(git rev-parse HEAD)" = "619965ec198047de519dc6eb098c7a56aed9bd58"
          test "$(git rev-parse HEAD^{tree})" = "d0059fd77462cf377b9dfd65d87a6afabc76077f"
          test "$(git hash-object manifest.json)" = "5b76b3f0ceb268d1bf43bff7c5dd54ab438076e7"

      - name: Download the retained Stage 4B-1P evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: stage4b-1p-premium-card-collection-persistence
          run-id: 46053970318
          github-token: ${{ github.token }}
          path: historical-1p

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Run offline reconciliation tests
        id: offline_reconciliation_tests
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        run: node --test test/catalogue-evidence-reconciliation-stage4b1vA5s1r2.test.mjs

      - name: Generate assignment, relationship, coverage, image and 1Q recovery reports
        id: reconciliation_reports
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        shell: bash
        run: |
          manifest="$(find historical-1p -maxdepth 2 -type f -name '*.json' -print -quit)"
          test -n "$manifest"
          node scripts/reconcileCatalogueEvidenceStage4b1vA5s1r2.mjs \
            --source-dir .source/koala-kollect-data \
            --historical-1p "$manifest" \
            --source-commit 619965ec198047de519dc6eb098c7a56aed9bd58 \
            --output-dir artifacts-stage4b1r2

      - name: Run fresh official HTTP checks for all 360 image exceptions
        id: image_exception_http_reconciliation
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        run: |
          node scripts/verifyCatalogueImageExceptionsStage4b1va5s1r9.mjs \
            --provenance artifacts-stage4b1r2/image-provenance-reconciliation.json \
            --run-http \
            --output artifacts-stage4b1r2/image-exception-http-reconciliation.json

      - name: Re-audit all 231 Premium image assignments
        id: premium_image_http_audit
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        shell: bash
        run: |
          manifest="$(find historical-1p -maxdepth 2 -type f -name '*.json' -print -quit)"
          test -n "$manifest"
          node scripts/auditPremiumCollectionImagesStage4b1va5s1r9.mjs \
            --historical-1p "$manifest" \
            --output artifacts-stage4b1r2/premium-image-http-reconciliation.json

      - name: Run the full offline zero-write importer integration
        id: importer_integration
        if: ${{ always() && steps.setup_node.outcome == 'success' }}
        shell: bash
        run: |
          manifest="$(find historical-1p -maxdepth 2 -type f -name '*.json' -print -quit)"
          test -n "$manifest"
          CATALOGUE_SOURCE_DIR=.source/koala-kollect-data CATALOGUE_HISTORICAL_1P="$manifest" \
            node --test tests/catalogueImporterStage4b1va.test.js

      - name: Run full application test suite
        id: full_test_suite
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: npm test

      - name: Run application lint
        id: lint
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Build production application
        id: production_build
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: npm run build

      - name: Upload reconciliation evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4b-1v-a5s-1r-2-evidence-reconciliation
          path: artifacts-stage4b1r2/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run if any reconciliation or validation failed
        id: final_acceptance
        if: always()
        shell: bash
        env:
          DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          OFFLINE_TESTS: ${{ steps.offline_reconciliation_tests.outcome }}
          RECONCILIATION: ${{ steps.reconciliation_reports.outcome }}
          IMAGE_EXCEPTIONS: ${{ steps.image_exception_http_reconciliation.outcome }}
          PREMIUM_IMAGES: ${{ steps.premium_image_http_audit.outcome }}
          IMPORTER: ${{ steps.importer_integration.outcome }}
          TESTS: ${{ steps.full_test_suite.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.production_build.outcome }}
          ARTIFACT_UPLOAD: ${{ steps.upload_evidence.outcome }}
        run: |
          failed=0
          for check in \
            "dependencies=$DEPENDENCIES" \
            "offline-reconciliation-tests=$OFFLINE_TESTS" \
            "catalogue-reconciliation=$RECONCILIATION" \
            "360-image-exception-reconciliation=$IMAGE_EXCEPTIONS" \
            "231-premium-image-audit=$PREMIUM_IMAGES" \
            "offline-importer-integration=$IMPORTER" \
            "full-tests=$TESTS" \
            "lint=$LINT" \
            "production-build=$BUILD" \
            "artifact-upload=$ARTIFACT_UPLOAD"; do
            name="${check%%=*}"
            outcome="${check#*=}"
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          test "$failed" -eq 0

# Reconciliation and both image audits run independently so failed classifications still produce diagnostic artifacts.
